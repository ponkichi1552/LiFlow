name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ios, android]
    env:
      HOUSEWORK_TEST_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install isolated API parser dependencies for security regressions
        run: npm run api:install

      - name: Ensure required feature regressions are still present
        run: node scripts/check-feature-contracts.mjs

      - name: Lint, typecheck, and test
        run: npm run check

  sharing-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Install server-only authentication dependencies
        run: npm run api:install
      - name: Audit dependencies for high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Audit API runtime dependencies
        run: npm --prefix server/appliance-care-api audit --audit-level=high
      - name: Verify sharing authorization and encrypted transport against local Firestore
        run: npx --yes firebase-tools@15.34.1 emulators:exec --non-interactive --only firestore,auth --project demo-liflow-sharing --config firebase.json "npm run test:sharing-cloud"
