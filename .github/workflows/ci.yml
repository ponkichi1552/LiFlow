name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ios, android]
    env:
      HOUSEWORK_TEST_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install API dependencies for security regressions
        run: |
          npm run api:install
          npm --prefix server/account-device-api ci --ignore-scripts

      # These configurations do not depend on HOUSEWORK_TEST_PLATFORM. Keep both
      # behavioral matrices, while running the same static checks only once.
      - name: Lint and typecheck
        if: matrix.platform == 'ios'
        run: npm run lint && npm run typecheck

      - name: Run platform behavior and required feature regressions
        run: npm test

  sharing-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the pinned Firestore emulator binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/firebase/emulators/cloud-firestore-emulator-v1.22.0.jar
          key: ${{ runner.os }}-firebase-tools-15.34.1-firestore-1.22.0
      - run: npm ci
      - name: Install server-only authentication dependencies
        run: npm run api:install
      - name: Install same-account device service dependencies
        run: npm --prefix server/account-device-api ci --ignore-scripts
      - name: Audit dependencies for moderate and higher vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Audit API runtime dependencies
        run: npm --prefix server/appliance-care-api audit --audit-level=moderate
      - name: Audit same-account device service dependencies
        run: npm --prefix server/account-device-api audit --audit-level=moderate
      - name: Verify sharing authorization and encrypted transport against local Firestore
        run: npx --yes firebase-tools@15.34.1 emulators:exec --non-interactive --only firestore,auth --project demo-liflow-sharing --config firebase.json "npm run test:sharing-cloud"
